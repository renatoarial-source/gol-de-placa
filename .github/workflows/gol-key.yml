name: Create Gol de Placa upload key

# Gera a chave de upload do Android só do Gol de Placa (separada das do Gelada e do Esconde-Esconde).
# Rodar à mão
# (Actions → "Create Gol de Placa upload key" → Run workflow).
# Baixe o artefato (fica disponível por 1 dia), guarde a chave em local seguro e
# cadastre os 4 secrets GOL_* indicados no SECRETS.txt (ver PUBLICAR.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        run: |
          mkdir out
          PASS=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -v -storetype JKS \
            -keystore out/gol-upload.jks -alias gol \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Gol de Placa, O=Arial, C=BR" >/dev/null 2>&1
          base64 -w0 out/gol-upload.jks > out/GOL_KEYSTORE_BASE64.txt
          printf '%s' "$PASS" > out/GOL_KEYSTORE_PASSWORD.txt
          printf '%s' "$PASS" > out/GOL_KEY_PASSWORD.txt
          printf '%s' "gol" > out/GOL_KEY_ALIAS.txt
          {
            echo "Cadastre em GitHub → Settings → Secrets and variables → Actions."
            echo "Cada secret tem o mesmo nome do arquivo .txt. Abra o arquivo, Ctrl+A, Ctrl+C e cole."
            echo
            echo "  GOL_KEYSTORE_BASE64   → GOL_KEYSTORE_BASE64.txt"
            echo "  GOL_KEYSTORE_PASSWORD → GOL_KEYSTORE_PASSWORD.txt"
            echo "  GOL_KEY_ALIAS         → GOL_KEY_ALIAS.txt"
            echo "  GOL_KEY_PASSWORD      → GOL_KEY_PASSWORD.txt"
            echo
            echo "Guarde gol-upload.jks e a senha em local seguro (ex.: gerenciador de senhas)."
            echo "Depois, apague este artefato no GitHub."
          } > out/LEIA-ME.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gol-android-upload-key
          path: out/
          retention-days: 1
