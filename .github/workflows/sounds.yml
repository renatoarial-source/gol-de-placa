name: Buscar sons gratuitos

# Baixa candidatos de som (Freesound/Pixabay) e salva na branch "sons-candidatos" para escolha.
on:
  workflow_dispatch:
    inputs:
      set:
        description: 'Jogo: gol, gelada ou esconde'
        default: gol

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-sounds.mjs
        env:
          SET: ${{ inputs.set }}
      - name: Salvar na branch sons-candidatos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          B=sons-candidatos; [ "${{ inputs.set }}" != "gol" ] && B="sons-candidatos-${{ inputs.set }}"
          git checkout -B "$B"
          git add -f store/sons-candidatos
          git commit -m "Sons candidatos (${{ inputs.set }})" || echo "nada novo"
          git push -f origin "$B"
