name: Google Play setup

# Preenche pela API a ficha do Gol na Google Play (8 idiomas, ícone, banner e capturas), o contato,
# os testadores e a versão do teste fechado, e a compra "Versão completa". Detalhes em store/play-setup.mjs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: capturas-loja
          path: capturas
          sparse-checkout: store/screenshots/appstore
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Capturas no formato da Google Play (1080x2160)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          for d in capturas/store/screenshots/appstore/*/; do
            l=$(basename "$d"); mkdir -p "$RUNNER_TEMP/play/$l"
            for f in "$d"*.png; do
              convert "$f" -resize x2160 -background '#0d3b1f' -gravity center -extent 1080x2160 -quality 92 "$RUNNER_TEMP/play/$l/$(basename "${f%.png}").jpg"
            done
          done
          ls "$RUNNER_TEMP/play"/*/ | head -20
      - run: node store/play-setup.mjs
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SHOTS: ${{ runner.temp }}/play
